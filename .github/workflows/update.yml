name: Curate and publish research radar
on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0' # Monday 08:17 KST
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selection and failure handling
        run: python -m unittest discover -s tests -v
      - name: Collect latest candidates
        run: python -m curator.pipeline
      - name: Preserve selections and history in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update curated papers and history"
            git push origin HEAD:main
          fi
      - name: Save collection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curation-audit
          path: |
            data/
            docs/data/papers.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
